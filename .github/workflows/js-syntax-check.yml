name: JS syntax check + smoke tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check app.js syntax
        run: node --check app.js || (echo "##[error]app.js has syntax errors"; exit 1)
      - name: Check LICENSE present
        run: test -f LICENSE || (echo "##[error]LICENSE missing"; exit 1)
      - name: Run smoke tests
        run: node --test tests/